[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-fan-controller-zwift"
# A verzió egyetlen forrása: smart_fan_controller/__init__.py __version__
dynamic = ["version"]
description = "Zwift-integrált okos ventilátor vezérlő – BLE, ANT+, Zwift UDP adatforrásokkal"
# 3.11+: enum.StrEnum, beépített TimeoutError-alias, modern asyncio.
# Gyakorlati felső határ jelenleg a 3.14: a HUD-hoz kellő PySide6 6.11 még
# nem támogatja a 3.15-öt (a program 3.15-ön is elindul, de HUD nélkül).
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "bleak>=1.0.0",
]

[project.optional-dependencies]
ant = ["openant>=1.3.0"]
zwift = ["requests>=2.32.0"]
ui = ["PySide6>=6.7.0"]
autolaunch = ["pywinauto>=0.6.9"]
all = [
    "bleak>=1.0.0",
    "openant>=1.3.0",
    "requests>=2.32.0",
    "PySide6>=6.7.0",
    "pywinauto>=0.6.9",
]
# Fejlesztői/teszt függőségek: pip install -e ".[dev]"
dev = ["pytest>=8.0"]

[project.scripts]
smart-fan-controller = "zwift_fan_controller:main"

[tool.setuptools.dynamic]
version = {attr = "smart_fan_controller.__version__"}

[tool.setuptools]
# Explicit felsorolás: a flat layout (csomag + két top-level belépőmodul)
# auto-discovery-vel nem egyértelmű.
py-modules = ["zwift_fan_controller", "zwift_api_polling"]

[tool.setuptools.packages.find]
include = ["smart_fan_controller*"]

[tool.setuptools.package-data]
# A config package versiókövetett default sablonja a pip-install csomagba is kerüljön.
"smart_fan_controller.config" = ["settings.default.json"]
# Az LCARS Antonio fontok és hangeffektek a package-be települjenek
# (a hud.py innen tölti be őket).
"smart_fan_controller" = [
    "fonts/*.ttf", "fonts/README.txt",
    "sounds/*.wav", "sounds/README.txt",
]

[tool.pytest.ini_options]
# A tesztkészlet nem használ pytest-asyncio-t: az aszinkron forgatókönyveket
# közvetlenül az asyncio.run() hajtja (lásd tests/test_pipeline.py).
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # A saját kódból jövő elavulás-figyelmeztetés hiba legyen, hogy időben
    # kiderüljön (pl. asyncio.set_event_loop a 3.14+ alatt)
    "error::DeprecationWarning:smart_fan_controller.*",
]
